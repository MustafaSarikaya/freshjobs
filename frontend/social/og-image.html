<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #FAF3E3;
    color: #2A2422;
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    position: relative;
  }
  .rows { position: absolute; inset: 0; }
  .row {
    position: absolute; height: 54px; border-radius: 14px;
    background: #F2E8D2; display: flex; align-items: center; gap: 14px; padding: 0 20px;
  }
  .row i { display: block; height: 12px; border-radius: 6px; background: #E3D6BA; }
  .row b {
    font: 700 13px/1 -apple-system, sans-serif; letter-spacing: .06em;
    color: #2F6B3E; background: #D7EBD0; padding: 6px 9px; border-radius: 999px;
  }
  .center {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
  }
  .brand { display: flex; align-items: center; gap: 30px; }
  .brand svg { width: 132px; height: 132px; filter: drop-shadow(0 10px 24px rgba(42,36,34,.18)); }
  h1 { font-size: 120px; font-weight: 800; letter-spacing: -0.035em; line-height: 1; }
  p.tag { margin-top: 34px; font-size: 38px; font-weight: 500; color: #5A4F49; letter-spacing: -0.01em; }
  .chips { margin-top: 38px; display: flex; gap: 12px; }
  .chips span {
    font-size: 24px; font-weight: 600; padding: 11px 20px; border-radius: 999px;
    background: #2A2422; color: #FAF3E3;
  }
  .chips span.more { background: transparent; color: #2A2422; box-shadow: inset 0 0 0 2px #2A2422; }
  .url { position: absolute; bottom: 28px; width: 100%; text-align: center; font-size: 22px; font-weight: 600; color: #8A7D72; letter-spacing: .02em; }
</style>
</head>
<body>
  <div class="rows">
    <div class="row" style="left:-40px; top:36px; width:380px"><b>NEW</b><i style="width:190px"></i><i style="width:70px"></i></div>
    <div class="row" style="left:-90px; top:104px; width:330px"><i style="width:160px"></i><i style="width:60px"></i></div>
    <div class="row" style="right:-50px; top:36px; width:360px"><i style="width:150px"></i><i style="width:80px"></i></div>
    <div class="row" style="right:-110px; top:104px; width:350px"><b>NEW</b><i style="width:130px"></i></div>
    <div class="row" style="left:-70px; bottom:80px; width:350px"><i style="width:170px"></i><i style="width:60px"></i></div>
    <div class="row" style="left:-30px; bottom:14px; width:300px"><b>NEW</b><i style="width:120px"></i></div>
    <div class="row" style="right:-40px; bottom:80px; width:340px"><b>NEW</b><i style="width:150px"></i></div>
    <div class="row" style="right:-100px; bottom:14px; width:380px"><i style="width:180px"></i><i style="width:70px"></i></div>
  </div>
  <div class="center">
    <div class="brand">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
        <rect width="64" height="64" rx="14" fill="#2A2422"/>
        <path d="M21 52V14h24M21 33h19" fill="none" stroke="#FAF3E3" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1>Fresh Jobs</h1>
    </div>
    <p class="tag">New tech openings, straight from company job boards</p>
    <div class="chips">
      <span>Spotify</span><span>Cohere</span><span>1Password</span><span>Wealthsimple</span><span>Supabase</span><span class="more">+ more</span>
    </div>
  </div>
  <div class="url">freshjobs.up.railway.app</div>
</body>
</html>
